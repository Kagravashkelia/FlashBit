name: Compilar FlashBit a WASM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      - name: Neutralizar incbin.h y compilar
        run: |
          mkdir -p dist

          # 1. Neutralizamos incbin.h agregando soportes para INCBIN e INCBIN_EXTERN
          INCBIN_PATH=$(find stockfish_nnue_probe -type f -name "incbin.h" | head -n 1)
          if [ -n "$INCBIN_PATH" ]; then
            echo "Neutralizando $INCBIN_PATH para WebAssembly..."
            cat << 'EOF' > "$INCBIN_PATH"
#ifndef INCBIN_HDR
#define INCBIN_HDR
#define INCBIN(NAME, FILENAME) \
    extern "C" { \
        const unsigned char g##NAME##Data[1] = {0}; \
        const unsigned char* const g##NAME##End = g##NAME##Data; \
        const unsigned int g##NAME##Size = 0; \
    }
#define INCBIN_EXTERN(NAME) \
    extern "C" { \
        extern const unsigned char g##NAME##Data[]; \
        extern const unsigned char* const g##NAME##End; \
        extern const unsigned int g##NAME##Size; \
    }
#endif
EOF
          fi

          # 2. Búsqueda de fuentes C++
          SRC_ENGINE=$(find src -type f -name "*.cpp")
          SRC_PROBE=$(find stockfish_nnue_probe -type f -name "*.cpp" \
            ! -name "main.cpp" \
            ! -name "NNUEBridge*" \
            ! -path "*/NNUEBridge*")

          NNUE_FILE=$(find . -type f -name "*.nnue" | head -n 1)

          echo "Archivo NNUE detectado: $NNUE_FILE"
          echo "Compilando FlashBit para WASM..."

          emcc $SRC_ENGINE $SRC_PROBE \
            -std=c++17 \
            -O3 \
            -msimd128 \
            -flto \
            -funroll-loops \
            -finline-functions \
            -fomit-frame-pointer \
            -DNDEBUG \
            -Iinclude \
            -Isrc \
            -Istockfish_nnue_probe \
            --embed-file $NNUE_FILE \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS="['_init_board', '_get_best_move']" \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORT_ES6=1 \
            -o dist/FlashBit.js

      - name: Subir artefacto compilado (.js y .wasm)
        uses: actions/upload-artifact@v4
        with:
          name: FlashBit-WASM-Build
          path: dist/
