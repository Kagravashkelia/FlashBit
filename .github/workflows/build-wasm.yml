name: Compilar FlashBit a WASM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona el código fuente del repositorio
      - name: Clonar código fuente
        uses: actions/checkout@v4

      # 2. Configura el SDK de Emscripten en la nube
      - name: Configurar Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      # 3. Compilación a WebAssembly con NNUE incrustada mediante el VFS de Emscripten
      - name: Compilar motor a WebAssembly
        run: |
          mkdir -p dist

          # Búsqueda dinámica de archivos .cpp excluyendo main y NNUEBridge no deseados
          SRC_ENGINE=$(find src -type f -name "*.cpp")
          SRC_PROBE=$(find stockfish_nnue_probe -type f -name "*.cpp" \
            ! -name "main.cpp" \
            ! -name "NNUEBridge*" \
            ! -path "*/NNUEBridge*")

          # Encuentra automáticamente el archivo de la red neuronal (.nnue) en tu proyecto
          NNUE_FILE=$(find . -type f -name "*.nnue" | head -n 1)

          echo "Archivo NNUE detectado: $NNUE_FILE"
          echo "Compilando código C++ e incrustando la red neuronal..."

          emcc $SRC_ENGINE $SRC_PROBE \
            -std=c++17 \
            -O3 \
            -msimd128 \
            -flto \
            -funroll-loops \
            -finline-functions \
            -fomit-frame-pointer \
            -DNDEBUG \
            -DNO_EMBEDDED_NNUE \
            -Iinclude \
            -Isrc \
            -Istockfish_nnue_probe \
            --embed-file $NNUE_FILE \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS="['_init_board', '_get_best_move']" \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORT_ES6=1 \
            -o dist/FlashBit.js

      # 4. Guardamos los binarios resultantes como artefactos en GitHub
      - name: Subir artefacto compilado (.js y .wasm)
        uses: actions/upload-artifact@v4
        with:
          name: FlashBit-WASM-Build
          path: dist/
