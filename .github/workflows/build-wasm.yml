name: Compilar FlashBit a WASM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      # 1. Clona el código fuente del repositorio
      - name: Clonar código fuente
        uses: actions/checkout@v4

      # 2. Configura el SDK de Emscripten
      - name: Configurar Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      # 3. Compilación limpia anulando el ensamblador x86 e incrustando la red vía VFS
      - name: Compilar motor a WebAssembly
        run: |
          mkdir -p dist

          # Búsqueda de archivos C++ excluyendo main y bridges no deseados
          SRC_ENGINE=$(find src -type f -name "*.cpp")
          SRC_PROBE=$(find stockfish_nnue_probe -type f -name "*.cpp" \
            ! -name "main.cpp" \
            ! -name "NNUEBridge*" \
            ! -path "*/NNUEBridge*")

          NNUE_FILE=$(find . -type f -name "*.nnue" | head -n 1)

          echo "Archivo NNUE detectado: $NNUE_FILE"
          echo "Compilando FlashBit para WASM..."

          emcc $SRC_ENGINE $SRC_PROBE \
            -std=c++17 \
            -O3 \
            -msimd128 \
            -flto \
            -funroll-loops \
            -finline-functions \
            -fomit-frame-pointer \
            -DNDEBUG \
            -D'INCBIN(name, file)=extern "C" { const unsigned char g##name##Data[1] = {0}; const unsigned char* const g##name##End = g##name##Data; const unsigned int g##name##Size = 0; }' \
            -Iinclude \
            -Isrc \
            -Istockfish_nnue_probe \
            --embed-file $NNUE_FILE \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS="['_init_board', '_get_best_move']" \
            -s EXPORTED_RUNTIME_METHODS='["cwrap", "ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORT_ES6=1 \
            -o dist/FlashBit.js

      # 4. Guarda los binarios resultantes
      - name: Subir artefacto compilado (.js y .wasm)
        uses: actions/upload-artifact@v4
        with:
          name: FlashBit-WASM-Build
          path: dist/
