name: Compilar Stormfish con Makefile

on: [push]

jobs:
  # 1. Compilación para Linux usando tu Makefile
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Ejecutar make (Linux)
      run: make
    - name: Guardar artefacto Linux
      uses: actions/upload-artifact@v4
      with:
        name: stormfish-linux
        path: stormfish

  # 2. Compilación para Windows usando tu Makefile
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Ejecutar make (Windows)
      run: make
    - name: Guardar artefacto Windows
      uses: actions/upload-artifact@v4
      with:
        name: stormfish-windows
        path: stormfish.exe

  # 3. Compilación para Android ARM64 inyectando el NDK en tu Makefile
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Descargar Android NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip -q android-ndk-r26b-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

    - name: Ejecutar make para Android (ARM64)
      run: |
        export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
        export CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
        make

    - name: Guardar artefacto Android
      uses: actions/upload-artifact@v4
      with:
        name: stormfish-android-arm64
        path: stormfish
